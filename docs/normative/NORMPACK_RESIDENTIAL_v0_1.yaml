# NORMPACK — пакет норм для проектирования жилого дома (v0.1)

> **Провенанс:** вклад автора, 2026-10-18. Источники: СП 54.13330.2022, СП 59.13330, СП 1.13130, СП 2.13130, СП 50.13330, СП 60.13330, СП 30.13330, СП 20.13330, СП 63.13330, ПП РФ № 87.

## 1. Принцип: пакет документов, не один СП

Для проектирования жилья нужен не один «главный СП», а **пакет**: градостроительные, объёмно-планировочные, противопожарные, конструктивные, инженерные, доступность, энергоэффективность, оформление ПД. BRAIM должен хранить и применять **пакет**, не отдельный документ.

## 2. Статус правил в BRAIM (принципиально, по автору)

**Каждому правилу нужен статус источника** (G-3, не молчит):

| Статус | Значение |
|---|---|
| `mandatory` | обязательно (с 1 сентября 2024 — реестр обязательных требований) |
| `recommended` | рекомендуется, но не обязательно |
| `regional` | действует на уровне субъекта |
| `conditional` | обязательно при определённых условиях |
| `superseded` | заменено более новой редакцией (G-1) |

**Плюс edition/revision/clause/effective_date/URL** — это и так в нашей `Braim-Registry` (P0-28), но теперь это **обязательный атрибут каждого правила**, не опциональный.

