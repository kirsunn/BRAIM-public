## 4. MVP — что в первом policy pack

Автор рекомендует **5 пакетов для первого контура** (не все 8+):

1. **СП 54.13330.2022** — планировки, состав, высоты, инсоляция, эксплуатация
2. **СП 50.13330.2024** — теплозащита, энергоэффективность
3. **СП 59.13330** — доступность
4. **СП 1.13130 + СП 2.13130** — эвакуация + огнестойкость
5. **СП 60.13330** — вентиляция и отопление

Дополнительно к ним (в нашем MVP уже есть):
- СП 20.13330 — нагрузки (нужны для конструктора)
- СП 63.13330 — железобетон
- ПП РФ № 87 — состав ПД

## 5. Структура в BRAIM (вариант v0.2)

```yaml
# recipes/normpack_residential_v0.1.yaml
normpack_id: residential_v0.1
description: Пакет норм для проектирования МКД (8 пакетов MVP)
applicable:
  building_use: [жилые, МКД, блокированная застройка, общежития квартирного типа]
  height_max_m: 75
  scope: проектирование, экспертиза

sources:
  - document_id: SP54.13330.2022
    effective_from: 2022-06-14
    publisher: Минстрой
    status: mandatory
    clauses_focus: [5, 6, 7, 8]   # помещения, высоты, инсоляция
  - document_id: SP50.13330.2024
    effective_from: 2024-XX-XX
    publisher: Минстрой
    status: mandatory
    clauses_focus: [5.7, табл.3]   # теплозащита
  - document_id: SP59.13330
    status: mandatory
  - document_id: SP1.13130
    status: mandatory
    clauses_focus: [4, 5]   # эвакуация
  - document_id: SP2.13130
    status: mandatory
  - document_id: SP60.13330
    status: mandatory
  - document_id: SP113.13330
    status: conditional
    when: [есть_паркинг_встроенный]
  - document_id: PPRF_87
    status: mandatory
    note: "определяет разделы ПД, не нормы"

# каждый source маппится на правила в templates_v0.1.yaml
# recipes/{СП54, СП50, ...} описывают rules, attribute, defaults, formulas
```

## 6. Чек-лист для MVP policy pack v0.1 (жильё)

- [ ] **СП 54**: высота 2,5 м (помещения), состав квартир, ширины коридоров
- [ ] **СП 59**: входные группы, пандусы, лифты (≥2,1×1,1 м кабина), МГН-санузлы
- [ ] **СП 1.13130**: ширина эвакуационного выхода ≥0,8 м (0,9 м МГН), длина пути ≤25 м при 1 эвакуационном выходе
- [ ] **СП 2.13130**: предел огнестойкости несущих стен REI 120
- [ ] **СП 50**: приведённое сопротивление теплопередаче R ≥ R_req (ГСОП-зависимое)
- [ ] **СП 60**: кратность воздухообмена (1 ч⁻¹ жилые)
- [ ] **СП 113**: парковки (если есть) — расстояния, маневровые площадки
- [ ] **ПП РФ № 87**: разделы ПД

## 7. Связь с Knowledge Core

Каждый `template_id` (`distance_min`, `width_min`, `height_min`, `area_min` и т.д.) уже есть в `templates_v0.1.yaml`. Пакет просто **связывает** source-doc (СП/ПП) + template (правило) + IFC-class (IfcSpace/IfcWall/...) в одной структуре.

## 8. Правила G-3 + L0-N + авторский постскриптум

- **G-3 (no silent missing):** status `mandatory|recommended|regional|conditional|superseded` обязателен
- **L0-N (no full copies):** храним edition/revision/URL, **не копируем текст СП**
- **Автор:** с 1 сентября 2024 — **новый механизм реестра обязательных требований** для проектов, подлежащих госэкспертизе. BRAIM должен отслеживать.

