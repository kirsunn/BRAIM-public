    note: "Это — реконструкция по общеизвестной классификации СП."
    source: "общепринятая структура + проверка смотри СП 555 pdf"
    status: "reconstruction"
    next_action: "открыть СП 555.pdf и заменить на таблицу 1 дословно"

  complexes:
